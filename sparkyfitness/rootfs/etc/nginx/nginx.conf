user root;
worker_processes 1;
pid /var/run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # These match the directories the upstream frontend entrypoint creates.
    client_body_temp_path /var/cache/nginx/client-body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    # The upstream entrypoint renders the SparkyFitness server block into
    # /etc/nginx/conf.d/default.conf. Its limit_req_zone needs http context,
    # which is why the include lives here rather than in a server block.
    include /etc/nginx/conf.d/*.conf;
}
